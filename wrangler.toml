name = "ownstage-qr"
main = "src/worker.ts"
compatibility_date = "2025-03-01"
account_id = "c0bdb071b67899c6590000ba154912e9"
workers_dev = true

[[routes]]
pattern = "qr.ownstage.app"
zone_name = "ownstage.app"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "LINKS"
id = "ebdb2ce6f1c44374afd270534ae4ac12"

[[d1_databases]]
binding = "DB"
database_name = "ownstage-qr"
database_id = "242a892d-586e-45dc-90eb-e68af8754b63"
migrations_dir = "migrations"

[vars]
PUBLIC_BASE_URL = "https://qr.ownstage.app"

# Set in production: wrangler secret put AUTH_PEPPER
# AUTH_PEPPER = "local-dev-only"
